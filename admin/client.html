<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chọn Ảnh Nhanh</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --bg: #050a14; --header-h: 50px; --footer-h: 70px; --strip-h: 90px; }
        body { background-color: var(--bg); color: #fff; font-family: 'Montserrat', sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
        
        .navbar { height: var(--header-h); background: #000; border-bottom: 1px solid #222; padding: 0 15px; z-index: 5000; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
        
        .header-left { display: flex; flex-direction: column; max-width: 70%; }
        .album-title { font-weight: 900; font-size: 0.8rem; color: var(--primary); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #displayFileName { font-size: 0.55rem; color: #aaa; font-weight: 700; text-transform: uppercase; margin-top: -2px; }

        .content-area { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        #photoGrid { height: 100%; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: min-content; gap: 10px; align-content: start; padding-bottom: 100px; -webkit-overflow-scrolling: touch; }
        @media (min-width: 768px) { #photoGrid { grid-template-columns: repeat(6, 1fr); } }

        .grid-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 1/1; background: #111; border: 2px solid transparent; transition: 0.2s; }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; opacity: 0.85; }
        .grid-item:hover { border-color: rgba(255,255,255,0.5); }
        .grid-item:hover img { transform: scale(1.08); opacity: 1; }
        .grid-item.focused { border-color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); }
        .grid-item.selected { border-color: var(--primary); }
        
        .vip-dot { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: var(--primary); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 10px; z-index: 10; border: 1.5px solid #000; }

        #photoViewer { position: absolute; inset: 0; background: #000; z-index: 4000; display: none; flex-direction: column; width: 100%; height: 100%; overflow: hidden; }
        
        .stage { 
            flex: 1; 
            min-height: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            padding: 10px; 
            position: relative; 
            width: 100%; 
            height: 100%;
        }
        
        .stage-inner { 
            position: relative !important; 
            display: flex !important; 
            align-items: center; 
            justify-content: center; 
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
        }
        
        #mainImg {
            max-width: 100%; 
            max-height: 100%; 
            width: auto; 
            height: auto; 
            object-fit: contain;
            display: block; 
            margin: auto; 
            -webkit-touch-callout: none; 
        }
        #photoInfoBadge { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 800; font-size: 0.7rem; border: 1px solid rgba(255,255,255,0.1); z-index: 4500; }

        .strip-luxury { height: var(--strip-h); background: #080808; border-top: 1px solid #222; display: flex; align-items: center; gap: 10px; padding: 0 15px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        .th-vip { height: 65px; width: 65px; border-radius: 10px; flex-shrink: 0; overflow: hidden; border: 2px solid transparent; opacity: 0.7; transition: 0.2s; position: relative; cursor: pointer; }
        .th-vip img { width: 100%; height: 100%; object-fit: cover; }
        .th-vip.act { opacity: 1; border-color: #fff; transform: scale(1.05); }
        .th-vip.sel { border-color: var(--primary); opacity: 1; }

        .bottom-bar { height: var(--footer-h); background: #000; border-top: 1px solid #222; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; z-index: 5000; flex-shrink: 0; }
        .btn-action { height: 42px; border-radius: 12px; font-weight: 900; border: none; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 0.75rem; }
        .btn-sq { width: 42px; font-size: 1.1rem; }
        .btn-text { padding: 0 20px; text-transform: uppercase; gap: 8px; }
        
        .bg-gray { background: #222; color: #fff; }
        .bg-primary { background: var(--primary); color: #000; }
        .bg-danger-vip { background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; }
        .bg-gradient-vip { background: linear-gradient(90deg, #00ebb0, #51ff7d); color: #000; }

        #loadOverlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .note-badge {
        position: absolute;
        bottom: 6px;
        left: 6px;
        background: #3b82f6; 
        color: #fff;
        border-radius: 50%;
        width: 22px;
        height: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        z-index: 10;
        border: 1.5px solid #000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

        .stage-inner { 
            position: relative; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            max-width: 100%; 
            max-height: 100%;
            min-height: 0; 
        }
        
        .watermark-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none; 
            z-index: 20;
            overflow: hidden;
        }
        
        .watermark-overlay img {
            width: 45%; 
            max-width: 250px; 
            opacity: 0.35; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            user-select: none;
            -webkit-user-select: none;
        }

        .heart-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 36px;
            height: 36px;
            background: rgba(0, 0, 0, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            z-index: 30;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .heart-btn.selected {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            transform: scale(1.1);
        }
       .stage-inner { 
    position: relative; /* Cực kỳ quan trọng để nút con absolute căn theo khung ảnh */
    display: flex; 
    align-items: center; 
    justify-content: center; 
    width: 100%; 
    height: 100%; 
    min-height: 0; 
}

#viewerHeartBtn {
    position: absolute !important;
    top: 20px !important;
    right: 20px !important;
    width: 44px;
    height: 44px;
    background: rgba(0, 0, 0, 0.7);
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    z-index: 5000;
    transition: 0.2s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    -webkit-tap-highlight-color: transparent;
}

#viewerHeartBtn.selected {
    background: var(--primary) !important;
    color: #000 !important;
    border-color: var(--primary) !important;
    transform: scale(1.1);
}
        .bottom-bar .d-flex {
    gap: 6px !important; 
}
    </style>
</head>
<body>

    <div id="loadOverlay"><div class="spinner-border text-success mb-2"></div><div style="font-weight: 900; color: var(--primary); font-size: 0.7rem; letter-spacing: 2px;">Chonanhnhanh.vn</div></div>
    <div id="errorNotificationBox" style="display: none; position: fixed; inset: 0; background: rgba(5, 10, 20, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;">
        <i class="fas fa-exclamation-triangle fa-3x text-warning mb-3"></i>
        <h3 class="fw-bold text-white mb-2">ĐÃ CÓ LỖI XẢY RA</h3>
        <p id="errorMessageText" class="text-secondary small mb-4" style="max-width: 400px; line-height: 1.6;">
            Không thể tải dữ liệu album. Vui lòng kiểm tra lại đường dẫn hoặc thử tải lại trang.
        </p>
        <button class="btn fw-900 px-4 py-2 rounded-pill text-black text-uppercase" style="background: var(--primary); border: none;" onclick="location.reload()">Tải Lại Trang</button>
    </div>
    <nav class="navbar">
        <div class="header-left">
            <div id="displayFileName">FILENAME.JPG</div>
            <div class="album-title" id="albumTitle">VIP ALBUM</div>
        </div>
        <div class="d-flex gap-2">
            <button id="btnGrid" style="background:transparent; border:none; color:var(--primary); font-weight:900; font-size:0.75rem;" onclick="setView('grid')">LƯỚI</button>
            <button id="btnViewer" style="background:transparent; border:none; color:#666; font-weight:900; font-size:0.75rem;" onclick="setView('viewer')">CHI TIẾT</button>
        </div>
    </nav>

    <div class="content-area">
        <div id="photoGrid"></div>
        <div id="photoViewer">
            <div class="stage">
                <div id="photoInfoBadge">0/0</div>
                
                <div class="stage-inner">
                    <img id="mainImg" src="">
                    <div id="viewerHeartBtn" onclick="togSel()"><i class="fas fa-heart"></i></div>
                    <div id="clientWatermarkContainer"></div>
                </div>
            </div>
            <div class="strip-luxury" id="strip"></div>
        </div>
    </div>
    <div id="commentBoxContainer" style="background: rgba(0,0,0,0.85); padding: 8px 15px; border-top: 1px solid #222; display: none; z-index: 4800;">
        <div class="input-group input-group-sm">
            <input type="text" id="photoCommentInput" class="form-control bg-dark text-white border-secondary" placeholder="Nhập ghi chú cho ảnh này...">
            <button class="btn btn-outline-light fw-bold" type="button" onclick="saveCurrentComment()">Lưu ghi chú</button>
        </div>
    </div>
    <div class="bottom-bar">
        <div class="d-flex gap-2">
            <button class="btn-action btn-sq bg-danger-vip" onclick="clearAll()"><i class="fas fa-undo-alt"></i></button>
            <button class="btn-action btn-sq bg-gray" id="btnFilter" onclick="toggleFilter()"><i class="fas fa-eye"></i></button>
        
            <button class="btn-action btn-sq bg-gray" id="btnDownload" onclick="downloadPhoto()" style="display: flex;" title="Tải ảnh gốc"><i class="fas fa-download"></i></button>
            <button class="btn-action btn-sq bg-gray" id="btnComment" onclick="commentPhoto()" style="display: flex;" title="Thêm ghi chú"><i class="fas fa-comment-dots"></i></button>
        </div>
        <div class="d-flex gap-2">
            <button class="btn-action btn-text bg-gradient-vip" onclick="finalCommit()">Chốt Chọn (<span id="totalPhotos">0</span>)</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const albumSlug = urlParams.get('album'); // Bắt tham số slug của album
        const studioSlug = urlParams.get('studio');
        let fid = '';
        let albumSettings = { download: false, comment: false, limitPhotos: 0, watermark_enabled: true, watermark_logo: '' };
        let watermarkHTML = ''; 
        const PATHS = { GET: 'https://wsm.congtubaclieu.com.vn/webhook/get-photos', SAVE: 'https://wsm.congtubaclieu.com.vn/webhook/save-selection', DONE: 'https://wsm.congtubaclieu.com.vn/webhook/finish-selection' };
        let photos=[], cur=0, currentView='grid', selectedIds = [], isFiltering = false;
        let imageCache = {};
        if (studioSlug) {
            console.log("Đang xem album thuộc Studio: " + studioSlug);
        }

        function getLink(id, sz) {
            if (!id) return '';
            const cleanId = String(id).trim();
            
            if (sz === 's100') return `https://lh3.googleusercontent.com/d/${cleanId}=w400`;
            if (sz === 's400') return `https://lh3.googleusercontent.com/d/${cleanId}=w400`;
            if (sz === 's800') return `https://lh3.googleusercontent.com/d/${cleanId}=h1200`;
            
            return `https://lh3.googleusercontent.com/d/${cleanId}=s1200`;
        }
        

        function setView(v) {
            currentView = v;
            const gridEl = document.getElementById('photoGrid');
            const viewerEl = document.getElementById('photoViewer');
        
            gridEl.style.display = 'none';
            viewerEl.style.display = 'none';

            document.getElementById('btnGrid').style.color = (v === 'grid') ? 'var(--primary)' : '#666';
            document.getElementById('btnViewer').style.color = (v === 'viewer') ? 'var(--primary)' : '#666';

            if(v === 'grid') {
                gridEl.style.display = 'grid';
                syncGridUI();
            } else if(v === 'viewer') {
                viewerEl.style.display = 'flex';
                showViewer();
            }
        }
        
       function syncGridUI() {
        if(currentView !== 'grid') return;
        const pCurrent = photos[cur];
        if(pCurrent) document.getElementById('displayFileName').innerText = pCurrent.name || "UNNAMED";
        
        photos.forEach((p, i) => {
            const el = document.getElementById(`item-${i}`); if(!el) return;
            const isSel = selectedIds.includes(p.id);
            const hasNote = p.note && p.note.trim() !== '';
            
            el.classList.toggle('focused', i === cur);
            el.classList.toggle('selected', isSel);
            const heartIcon = el.querySelector('.heart-btn');
            if(heartIcon) {
                heartIcon.classList.toggle('selected', isSel);
            }
    
            let noteIcon = el.querySelector('.note-badge');
            if(hasNote) {
                if(!noteIcon) el.insertAdjacentHTML('beforeend', `<div class="note-badge" title="Xem ghi chú" onclick="event.stopPropagation(); openViewNoteModal('${p.id}');"><i class="fas fa-comment-alt"></i></div>`);
            } else if(noteIcon) {
                noteIcon.remove();
            }
            el.style.display = (isFiltering && !isSel) ? 'none' : 'block';
        });
        updateInfo();
    }
      function showViewer() {
        const p = photos[cur]; 
        if(!p) return;
        
        document.getElementById('displayFileName').innerText = p.name || "UNNAMED";
        document.getElementById('photoInfoBadge').innerText = `${cur + 1} / ${photos.length}`;
    
        const isSel = selectedIds.includes(p.id);
        const viewerHeart = document.getElementById('viewerHeartBtn');
        if(viewerHeart) {
            viewerHeart.classList.toggle('selected', isSel);
        }
    
        const watermarkContainer = document.getElementById('clientWatermarkContainer');
        if (watermarkContainer) {
            watermarkContainer.innerHTML = watermarkHTML;
        }
    
        const mainImg = document.getElementById('mainImg');
        if(mainImg) {
            const targetUrl = getLink(p.id, 's800');
            if (imageCache[targetUrl]) {
                mainImg.src = targetUrl;
            } else {
                mainImg.src = targetUrl;
                const preloader = new Image();
                preloader.src = targetUrl;
                preloader.onload = () => { imageCache[targetUrl] = true; };
            }
            mainImg.onerror = function() {
                this.src = `https://lh3.googleusercontent.com/d/${p.id}=s400`;
            };
        }
        [cur + 1, cur + 2, cur - 1].forEach(index => {
            if (photos[index]) {
                const nextUrl = getLink(photos[index].id, 's800');
                if (!imageCache[nextUrl]) {
                    const imgPre = new Image();
                    imgPre.src = nextUrl;
                    imgPre.onload = () => { imageCache[nextUrl] = true; };
                }
            }
        });
    
        const strip = document.getElementById('strip'); 
        strip.innerHTML = '';    
        photos.forEach((photoItem, i) => {
            const isSelThumb = selectedIds.includes(photoItem.id);
            const hasNote = photoItem.note && photoItem.note.trim() !== '';
            if(isFiltering && !isSelThumb) return;
            
            const th = document.createElement('div');
            th.className = `th-vip ${i === cur ? 'act' : ''} ${isSelThumb ? 'sel' : ''}`;
            
            const thumbImg = document.createElement('img');
            thumbImg.src = getLink(photoItem.id, 's100');
            thumbImg.onerror = function() {
                this.src = `https://lh3.googleusercontent.com/d/${photoItem.id}=w400`;
            };
            th.appendChild(thumbImg);
            if(isSelThumb) {
                th.insertAdjacentHTML('beforeend', `<div class="vip-dot" style="width:16px; height:16px; font-size:8px; top:2px; right:2px; background:var(--primary); color:#000;"><i class="fas fa-heart" style="font-size:7px;"></i></div>`);
            }
            
            if(hasNote) {
                th.insertAdjacentHTML('beforeend', `<div class="note-badge" title="Xem ghi chú" style="width:14px; height:14px; font-size:7px; bottom:2px; left:2px;" onclick="event.stopPropagation(); openViewNoteModal('${photoItem.id}');"><i class="fas fa-comment"></i></div>`);
            }
            
            th.onclick = () => { cur = i; showViewer(); };
            strip.appendChild(th);
        });
        
        const activeTh = strip.querySelector('.act');
        if(activeTh) setTimeout(() => activeTh.scrollIntoView({behavior:'smooth', inline:'center'}), 50);
        updateInfo();
    }
        function initGrid() {
            const grid = document.getElementById('photoGrid'); 
            if (!grid) return;
            grid.innerHTML = '';
            
            photos.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'grid-item'; 
                item.id = `item-${i}`;
                
                const isSel = selectedIds.includes(p.id);
                
                item.innerHTML = `
                    <img src="${getLink(p.id, 's400')}" loading="lazy">
                    <div class="heart-btn ${isSel ? 'selected' : ''}" onclick="event.stopPropagation(); quickToggleSel('${p.id}')">
                        <i class="fas fa-heart"></i>
                    </div>
                `;
                
                item.onclick = () => { cur = i; syncGridUI(); };
                item.ondblclick = () => { cur = i; setView('viewer'); };
                grid.appendChild(item);
            });
            syncGridUI();
        }
        
        function quickToggleSel(photoId) {
            const p = photos.find(x => x.id === photoId);
            if (!p) return;
            const idx = selectedIds.indexOf(photoId);
            
            if (idx === -1) {
                if (albumSettings.limitPhotos > 0 && selectedIds.length >= albumSettings.limitPhotos) {
                    return alert(`Dạ, album này được giới hạn chọn tối đa ${albumSettings.limitPhotos} ảnh ạ!`);
                }
                selectedIds.push(photoId);
            } else {
                selectedIds.splice(idx, 1);
            }
            
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedIds));
            syncGridUI();
            if(currentView === 'viewer') showViewer();
            fetch(PATHS.SAVE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: photoId, selected: idx === -1}) });
        }
        async function saveCurrentComment() {
            const p = photos[cur];
            if (!p) return;
            
            const inputEl = document.getElementById('photoCommentInput');
            const noteVal = inputEl ? inputEl.value.trim() : '';

            const notesMap = JSON.parse(localStorage.getItem('ghi_chu_anh_' + fid) || '{}');
            if (noteVal) {
                notesMap[p.id] = noteVal;
                p.note = noteVal; // Cập nhật luôn vào mảng photos hiện tại
            } else {
                delete notesMap[p.id];
                p.note = '';
            }
            localStorage.setItem('ghi_chu_anh_' + fid, JSON.stringify(notesMap));
            
            showToast("Đã cập nhật ghi chú thành công!");

            const container = document.getElementById('commentBoxContainer');
            if (container) container.style.display = 'none';

            currentView === 'grid' ? syncGridUI() : showViewer();
            
            try {
                await fetch(PATHS.SAVE, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        id: p.id, 
                        note: noteVal 
                    }) 
                });
            } catch(e) {
                console.log("Lỗi đồng bộ ghi chú ngầm");
            }
        }
       function togSel() {
            const p = photos[cur];
            if (!p) return;
            const idx = selectedIds.indexOf(p.id);
            
            if (idx === -1) {
                if (albumSettings.limitPhotos > 0 && selectedIds.length >= albumSettings.limitPhotos) {
                    return alert(`Dạ, album này được giới hạn chọn tối đa ${albumSettings.limitPhotos} ảnh ạ!`);
                }
                selectedIds.push(p.id);
            } else {
                selectedIds.splice(idx, 1);
            }
            
            localStorage.setItem('anh_da_chon_cua_khach_' + fid, JSON.stringify(selectedIds));
            showViewer();
            fetch(PATHS.SAVE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id: p.id, selected: idx === -1}) });
        }
        
        
        function openViewNoteModal(photoId) {
            const p = photos.find(x => x.id === photoId);
            if (!p) return;
            document.getElementById('modalNoteImg').src = getLink(p.id, 's200');
            document.getElementById('modalNoteContent').innerText = p.note || "Không có ghi chú nào.";
            new bootstrap.Modal(document.getElementById('viewNoteModal')).show();
        }
        function toggleFilter() {
            if(selectedIds.length === 0 && !isFiltering) return alert("Dạ chưa chọn ảnh nào!");
            isFiltering = !isFiltering;
            document.getElementById('btnFilter').classList.toggle('bg-primary', isFiltering);
            if(isFiltering) {
                const firstSel = photos.findIndex(p => selectedIds.includes(p.id));
                if(firstSel !== -1) cur = firstSel;
                setView('grid');
            } else { syncGridUI(); }
        }

        function clearAll() { if(confirm("Xóa toàn bộ ảnh đã chọn?")) { selectedIds = []; localStorage.setItem('anh_da_chon_cua_khach_' + fid, "[]"); isFiltering = false; syncGridUI(); } }

        function updateInfo() {
            const totalEl = document.getElementById('totalPhotos');
            if (totalEl) {
                totalEl.innerText = selectedIds.length;
            }
        }
        async function finalCommit(){
            if(selectedIds.length === 0) return alert("Dạ khách chưa chọn ảnh nào ạ!");
            if(confirm(`Gửi ${selectedIds.length} ảnh đã chọn?`)) {
                try { await fetch(PATHS.DONE, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ id: fid, selected_ids: selectedIds, count: selectedIds.length }) }); alert("✅ Tuyệt vời! Yêu cầu đã được lưu."); } catch(e) { alert("Lỗi gửi!"); }
            }
        }
        function showToast(msg) {
            let t = document.getElementById('toastNotice');
            if (!t) {
                t = document.createElement('div');
                t.id = 'toastNotice';
                t.style.cssText = 'position:fixed; top:110px; right:30px; background:var(--primary); color:#000; padding:10px 25px; border-radius:10px; z-index:10000; font-weight:900; display:none; box-shadow:0 10px 30px rgba(0,0,0,0.5);';
                document.body.appendChild(t);
            }
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2200);
        }
        async function downloadPhoto() {
            const p = photos[cur];
            if (!p) return;
            showToast("Đang tải ảnh gốc...");
            const downloadUrl = `https://drive.google.com/uc?export=download&id=${p.id}`;
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = p.name || `photo_${p.id}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
        async function commentPhoto() {
            const p = photos[cur];
            if (!p) return;
            const currentNote = p.note || '';
            const userNote = prompt(`Nhập ghi chú cho ảnh [${p.name || 'Ảnh'}]:`, currentNote);
            if (userNote === null) return; // Khách bấm Hủy thì thoát
            
            const trimmedNote = userNote.trim();
            p.note = trimmedNote;
            
            showToast("Đang lưu ghi chú...");
            currentView === 'grid' ? syncGridUI() : showViewer();
            try {
                await fetch(PATHS.SAVE, { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ 
                        id: p.id, 
                        note: trimmedNote 
                    }) 
                });
                showToast("Đã lưu ghi chú thành công!");
            } catch(e) {
                alert("Lỗi kết nối khi lưu ghi chú!");
            }
        }

    async function init() {
    const errorBox = document.getElementById('errorNotificationBox');
    const errorText = document.getElementById('errorMessageText');
    const loadOverlay = document.getElementById('loadOverlay');

    try {
        const urlParams = new URLSearchParams(window.location.search);
        const albumSlug = urlParams.get('album');
        const studioSlug = urlParams.get('studio');

        if (!albumSlug) {
            throw new Error("Không tìm thấy đường dẫn định danh album trên trình duyệt.");
        }

        const res = await fetch(`${PATHS.GET}?studio=${studioSlug}&album=${albumSlug}`);
        if (!res.ok) {
            throw new Error(`Máy chủ phản hồi lỗi (Mã trạng thái: ${res.status}). Album có thể không tồn tại.`);
        }

        const rawData = await res.json();
        const data = Array.isArray(rawData) ? rawData[0] : rawData;
        
        if (!data) {
            throw new Error("Dữ liệu trả về từ máy chủ trống.");
        }

        photos = data.photos || [];
        albumSettings = data.settings || albumSettings;
        
        window.fid = data.folder_id || albumSlug; 
        fid = window.fid;
        if (photos.length === 0) {
            throw new Error("Album này hiện tại chưa có bức ảnh nào hoặc đang trong quá trình đồng bộ.");
        }

        const clientLogo = albumSettings.watermark_logo || '';
        const isWatermarkOn = albumSettings.watermark_enabled !== false;
        
        watermarkHTML = (isWatermarkOn && clientLogo) ? `<div class="watermark-overlay"><img src="${clientLogo}" alt="Logo"></div>` : '';
        
        // 🌟 XỬ LÝ CHUẨN XÁC THEO SERVER (Ép kiểu boolean để xử lý cả dạng chuỗi "true"/"false" từ API)
        const allowDownload = (albumSettings.download === true || albumSettings.download === 'true' || albumSettings.download === 1);
        const allowComment = (albumSettings.comment === true || albumSettings.comment === 'true' || albumSettings.comment === 1);

        const btnDownloadEl = document.getElementById('btnDownload');
        const btnCommentEl = document.getElementById('btnComment');

        if (btnDownloadEl) {
            btnDownloadEl.style.setProperty('display', allowDownload ? 'flex' : 'none', 'important');
        }
        if (btnCommentEl) {
            btnCommentEl.style.setProperty('display', allowComment ? 'flex' : 'none', 'important');
        }

        let folderName = photos[0].folderName || "VIP ALBUM";
        let studioFullName = data.studioName || data.name || data.studio_name || data.studio_slug || "";
        if ((!studioFullName || studioFullName.toLowerCase() === 'studio') && studioSlug && studioSlug.toLowerCase() !== 'studio') {
            studioFullName = studioSlug;
        }
        if (studioFullName && studioFullName.toLowerCase() !== 'studio') {
            document.title = `${studioFullName.toUpperCase()} - ${folderName}`;
            document.getElementById('albumTitle').innerText = `${studioFullName.toUpperCase()} - ${folderName}`;
        } else {
            document.title = folderName;
            document.getElementById('albumTitle').innerText = folderName;
        }

        const local = localStorage.getItem('anh_da_chon_cua_khach_' + (window.fid || albumSlug));
        if (local) selectedIds = JSON.parse(local);
        
        loadOverlay.style.display = 'none';
        initGrid(); 
        
    } catch(e) { 
        console.error(e);
        loadOverlay.style.display = 'none';
        if (errorText) errorText.innerText = e.message || "Không tìm thấy album hoặc tên đường dẫn không tồn tại.";
        if (errorBox) {
            errorBox.style.setProperty('display', 'flex', 'important');
        }
    }
}
        init();
    </script>

                <div class="modal-header border-0">
                    <h5 class="modal-title text-primary fw-900" style="font-size: 0.95rem;">GHI CHÚ CỦA ẢNH</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
