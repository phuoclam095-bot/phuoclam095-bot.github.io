<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết Kế Album Khổ 70x25 cm (Spread 35x25) - ChonAnhNhanh.vn</title>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-mu: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #334155;
            --radius: 12px;
        }
        [data-theme="light"] {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-mu: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }

        .container { width: 100%; max-width: 1300px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h2 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .mu { color: var(--text-mu); font-size: 13.5px; }

        .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        select, button, .btn { padding: 9px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); transition: 0.2s; }
        select:focus, button:focus { outline: none; border-color: var(--primary); }
        button.pri { background: var(--primary); color: #fff; border: none; }
        button.pri:hover { background: var(--primary-hover); }

        /* Khung Workspace tỷ lệ chuẩn 70x25 cm (Tỷ lệ 14:5) */
        .workspace-container { display: flex; justify-content: center; align-items: center; background: #05070a; border: 2px solid var(--border); border-radius: 14px; width: 100%; padding: 20px; overflow: hidden; position: relative; }
        #album-canvas { width: 100%; max-height: 550px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: block; background: #000; }

        /* Khu vực thảy nhiều ảnh cùng lúc */
        .dropzone-box { border: 2px dashed var(--primary); background: rgba(59, 130, 246, 0.05); padding: 25px; border-radius: 12px; text-align: center; margin-top: 20px; cursor: pointer; transition: 0.2s; }
        .dropzone-box:hover { background: rgba(59, 130, 246, 0.1); }
        
        .thumb-preview-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .thumb-item { width: 75px; height: 75px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); position: relative; background: #000; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header-flex">
            <div>
                <h2>📖 Phần Mềm Dàn Trang Album (Khổ Trang Đôi 70x25 cm)</h2>
                <p class="mu">Mỗi trang 35x25 cm, ghép đôi thành 70x25 cm (Tỷ lệ 14:5 chuẩn in ấn cao cấp).</p>
            </div>
            <div class="toolbar">
                <!-- Chọn Dạng Layout Đa Dạng -->
                <select id="sel-layout">
                    <option value="blur_center">✨ Nền mờ nghệ thuật + Khung nổi giữa</option>
                    <option value="grid_2">🖼️ Lưới 2 ảnh cân đối (Trái / Phải)</option>
                    <option value="grid_3">📐 Lưới 3 ảnh (1 Ảnh lớn trái, 2 Ảnh nhỏ phải)</option>
                    <option value="grid_4">📑 Lưới 4 ảnh kiểu Tạp chí</option>
                    <option value="asym_split">💎 Bố cục bất đối xứng nghệ thuật</option>
                </select>

                <button class="pri" id="btn-export">📥 Xuất File In 70x25 (DPI Cao)</button>
            </div>
        </div>

        <!-- CANVAS WORKSPACE (Độ phân giải chuẩn in 2800x1000 cho sắc nét tuyệt đối) -->
        <div class="workspace-container">
            <canvas id="album-canvas" width="2800" height="1000"></canvas>
        </div>

        <!-- KHU VỰC THẢ ẢNH HÀNG LOẠT -->
        <div class="dropzone-box" onclick="document.getElementById('multi-file-input').click()">
            <b style="font-size: 15px;">📁 Thảy nhiều ảnh vào đây (Chọn từ 3 đến 6 tấm)</b>
            <p class="mu" style="margin-top: 4px;">Bấm vào đây hoặc kéo thả hàng loạt ảnh gốc từ máy tính của bạn vào.</p>
            <input type="file" id="multi-file-input" accept="image/*" multiple style="display: none;">
        </div>

        <!-- Danh sách ảnh đã thảy -->
        <div class="thumb-preview-list" id="thumb-container"></div>
    </div>
</div>

<script>
/* --- LOGIC DÀN TRANG ALBUM KHỔ 70x25 CM (TỶ LỆ 14:5) --- */
const Album70x25Studio = {
    images: [],
    canvasWidth: 2800,  // Độ phân giải cao cho khổ 70cm
    canvasHeight: 1000, // Độ phân giải cao cho khổ 25cm
    currentLayout: 'blur_center',

    init() {
        this.bindEvents();
        this.redraw();
    },

    bindEvents() {
        document.getElementById('sel-layout').onchange = (e) => {
            this.currentLayout = e.target.value;
            this.redraw();
        };

        // Nhận nhiều ảnh thảy vào
        document.getElementById('multi-file-input').onchange = (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        this.images.push(img);
                        this.renderThumbnails();
                        this.redraw();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        // Xuất file ảnh in chất lượng cao
        document.getElementById('btn-export').onclick = () => {
            const canvas = document.getElementById('album-canvas');
            const link = document.createElement('a');
            link.download = `album_70x25_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.98);
            link.click();
        };
    },

    renderThumbnails() {
        const container = document.getElementById('thumb-container');
        container.innerHTML = this.images.map((img, idx) => `
            <div class="thumb-item" title="Ảnh ${idx + 1}">
                <img src="${img.src}">
            </div>
        `).join('');
    },

    redraw() {
        const canvas = document.getElementById('album-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (this.images.length === 0) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = '26px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('Hãy thảy 3 - 4 tấm ảnh vào khung bên dưới để bắt đầu dàn trang 70x25 cm', canvas.width / 2, canvas.height / 2);
            return;
        }

        // Vẽ đường gáy sách mờ ở chính giữa (giữa trang 35cm trái và 35cm phải)
        this.drawSpineLine(ctx, canvas);

        // Phân bổ theo layout
        if (this.currentLayout === 'blur_center') {
            this.drawBlurCenter(ctx, canvas, this.images[0]);
        } else if (this.currentLayout === 'grid_2') {
            this.drawGrid2(ctx, canvas, this.images);
        } else if (this.currentLayout === 'grid_3') {
            this.drawGrid3(ctx, canvas, this.images);
        } else if (this.currentLayout === 'grid_4') {
            this.drawGrid4(ctx, canvas, this.images);
        } else if (this.currentLayout === 'asym_split') {
            this.drawAsymSplit(ctx, canvas, this.images);
        }
    },

    // Vẽ đường gáy sách phân định 2 trang 35cm
    drawSpineLine(ctx, canvas) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.restore();
    },

    // 1. Nền mờ nghệ thuật + Khung nổi giữa
    drawBlurCenter(ctx, canvas, img) {
        ctx.save();
        ctx.filter = 'blur(30px) brightness(0.4)';
        const r = Math.max(canvas.width / img.width, canvas.height / img.height);
        const w = img.width * r, h = img.height * r;
        ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        ctx.restore();

        const fW = 1400; // Chiếm độ rộng vừa đẹp trên tổng 2800
        const fH = 750;
        const fX = (canvas.width - fW) / 2;
        const fY = (canvas.height - fH) / 2;

        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fX - 15, fY - 15, fW + 30, fH + 30);

        ctx.save();
        ctx.beginPath();
        ctx.rect(fX, fY, fW, fH);
        ctx.clip();

        const ir = Math.max(fW / img.width, fH / img.height);
        ctx.drawImage(img, fX + (fW - img.width * ir) / 2, fY + (fH - img.height * ir) / 2, img.width * ir, img.height * ir);
        ctx.restore();
    },

    // 2. Lưới 2 ảnh (Trang trái & Trang phải)
    drawGrid2(ctx, canvas, imgs) {
        const im1 = imgs[0], im2 = imgs[1] || imgs[0];
        const pad = 80, w = (canvas.width - (pad * 3)) / 2, h = canvas.height - (pad * 2);

        [ { x: pad, im: im1 }, { x: pad * 2 + w, im: im2 } ].forEach(slot => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(slot.x - 12, pad - 12, w + 24, h + 24);
            ctx.save();
            ctx.beginPath();
            ctx.rect(slot.x, pad, w, h);
            ctx.clip();
            const r = Math.max(w / slot.im.width, h / slot.im.height);
            ctx.drawImage(slot.im, slot.x + (w - slot.im.width * r) / 2, pad + (h - slot.im.height * r) / 2, slot.im.width * r, slot.im.height * r);
            ctx.restore();
        });
    },

    // 3. Lưới 3 ảnh (1 lớn trái, 2 nhỏ phải)
    drawGrid3(ctx, canvas, imgs) {
        const im1 = imgs[0], im2 = imgs[1] || im1, im3 = imgs[2] || im1;
        const pad = 60;
        const mainW = (canvas.width / 2) - pad - 30;
        const mainH = canvas.height - (pad * 2);
        
        // Ô lớn bên trái
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(pad - 10, pad - 10, mainW + 20, mainH + 20);
        ctx.save();
        ctx.beginPath(); ctx.rect(pad, pad, mainW, mainH); ctx.clip();
        let r = Math.max(mainW / im1.width, mainH / im1.height);
        ctx.drawImage(im1, pad + (mainW - im1.width * r) / 2, pad + (mainH - im1.height * r) / 2, im1.width * r, im1.height * r);
        ctx.restore();

        // 2 ô nhỏ bên phải
        const subX = pad + mainW + 60;
        const subW = canvas.width - subX - pad;
        const subH = (mainH - pad) / 2;

        [ { y: pad, im: im2 }, { y: pad + subH + pad, im: im3 } ].forEach(sub => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(subX - 10, sub.y - 10, subW + 20, subH + 20);
            ctx.save();
            ctx.beginPath(); ctx.rect(subX, sub.y, subW, subH); ctx.clip();
            let sr = Math.max(subW / sub.im.width, subH / sub.im.height);
            ctx.drawImage(sub.im, subX + (subW - sub.im.width * sr) / 2, sub.y + (subH - sub.im.height * sr) / 2, sub.im.width * sr, sub.im.height * sr);
            ctx.restore();
        });
    },

    // 4. Lưới 4 ảnh tạp chí
    drawGrid4(ctx, canvas, imgs) {
        const pad = 60;
        const w = (canvas.width - (pad * 3)) / 2;
        const h = (canvas.height - (pad * 3)) / 2;

        const coords = [
            { x: pad, y: pad },
            { x: pad * 2 + w, y: pad },
            { x: pad, y: pad * 2 + h },
            { x: pad * 2 + w, y: pad * 2 + h }
        ];

        coords.forEach((c, idx) => {
            const im = imgs[idx % imgs.length];
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(c.x - 10, c.y - 10, w + 20, h + 20);
            ctx.save();
            ctx.beginPath(); ctx.rect(c.x, c.y, w, h); ctx.clip();
            const r = Math.max(w / im.width, h / im.height);
            ctx.drawImage(im, c.x + (w - im.width * r) / 2, c.y + (h - im.height * r) / 2, im.width * r, im.height * r);
            ctx.restore();
        });
    },

    // 5. Bố cục bất đối xứng nghệ thuật
    drawAsymSplit(ctx, canvas, imgs) {
        const im1 = imgs[0], im2 = imgs[1] || im1;
        const pad = 60;
        // Chia lệch tỷ lệ 60% - 40%
        const w1 = canvas.width * 0.58 - pad;
        const w2 = canvas.width - w1 - (pad * 3);
        const h = canvas.height - (pad * 2);

        [ { x: pad, w: w1, im: im1 }, { x: pad * 2 + w1, w: w2, im: im2 } ].forEach(slot => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(slot.x - 10, pad - 10, slot.w + 20, h + 20);
            ctx.save();
            ctx.beginPath();
            ctx.rect(slot.x, pad, slot.w, h);
            ctx.clip();
            const r = Math.max(slot.w / slot.im.width, h / slot.im.height);
            ctx.drawImage(slot.im, slot.x + (slot.w - slot.im.width * r) / 2, pad + (h - slot.im.height * r) / 2, slot.im.width * r, slot.im.height * r);
            ctx.restore();
        });
    }
};

// Khởi chạy
Album70x25Studio.init();
</script>

</body>
</html>
