<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Quét Live QR CCCD (Debug)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      max-width: 500px;
      margin: 20px auto;
      padding: 0 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .cam-box {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4 / 3;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .guide {
      position: absolute;
      width: 220px;
      height: 220px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid #10b981;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button, .btn-file {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
    }
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #ecfdf5;
      color: #065f46;
    }
    .status.err {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .meta {
      margin-top: 6px;
      font-size: 12px;
      color: #64748b;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px;">Test Quét Live QR CCCD</h2>
    <p style="margin:0 0 10px; font-size:13px; color:#475569;">
      Đưa mã QR vào khung xanh. Di chuyển thẻ ra/vào từ từ (khoảng 12–25 cm) để camera bắt nét.
    </p>

    <div class="cam-box">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide"></div>
    </div>

    <div id="status" class="status">Đang khởi tạo...</div>
    <div id="meta" class="meta">Trạng thái quét: chờ camera</div>

    <div class="row">
      <button type="button" class="primary" id="btnRestart">Quét lại live</button>
      <label class="btn-file">
        Chụp / Chọn ảnh QR
        <input type="file" id="imgInput" accept="image/*" capture="environment" hidden />
      </label>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px; font-size:15px;">Kết quả quét được</h3>
    <pre id="result">Chưa nhận diện được mã QR nào.</pre>
  </div>

  <canvas id="workCanvas" style="display:none;"></canvas>

  <script type="module">
    import { BrowserQRCodeReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm';

    const video = document.getElementById('video');
    const canvas = document.getElementById('workCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const statusEl = document.getElementById('status');
    const metaEl = document.getElementById('meta');
    const resultEl = document.getElementById('result');
    const btnRestart = document.getElementById('btnRestart');
    const imgInput = document.getElementById('imgInput');

    const reader = new BrowserQRCodeReader();
    const hasBarcodeDetector = ('BarcodeDetector' in window);
    const nativeDetector = hasBarcodeDetector ? new BarcodeDetector({ formats: ['qr_code'] }) : null;

    let stream = null;
    let timerId = null;
    let isBusy = false;
    let isDone = false;
    let tickCount = 0;

    function setStatus(text, isErr = false) {
      statusEl.textContent = text;
      statusEl.className = isErr ? 'status err' : 'status';
    }

    function parseCCCD(raw) {
      const text = (raw || '').trim();
      if (!text) return null;
      if (/^https?:\/\//i.test(text) || /^000201/i.test(text) || /^WIFI:/i.test(text)) {
        return { invalid: true, reason: 'Mã QR không phải của CCCD (URL/ngân hàng/Wi-Fi).' };
      }

      if (text.includes('|')) {
        const parts = text.split('|').map(s => s.trim());
        const soCCCD = parts.find(p => /^\d{12}$/.test(p));
        const dobRaw = parts.find(p => /^(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])(19\d\d|20\d\d)$/.test(p));
        if (!soCCCD && !dobRaw) {
          return { invalid: true, reason: 'Chuỗi có dấu "|" nhưng không khớp định dạng CCCD.' };
        }
        const dobIdx = parts.indexOf(dobRaw);
        const ngaySinh = dobRaw ? `${dobRaw.slice(0,2)}/${dobRaw.slice(2,4)}/${dobRaw.slice(4)}` : '';
        const hoTen = (dobIdx > 0
          ? parts.slice(0, dobIdx).reverse().find(p => /[A-Za-zÀ-ỹ\s]{2,}/.test(p) && !/^\d+$/.test(p) && p !== soCCCD)
          : '') || parts[2] || '';
        const diaChi = dobIdx !== -1 ? (parts.slice(dobIdx + 2).find(p => p && !/^\d{8}$/.test(p)) || '') : '';
        return { invalid: false, soCCCD: soCCCD || '', hoTen, ngaySinh, diaChi, raw: text };
      }

      if (/^\d{12}$/.test(text)) {
        return { invalid: false, soCCCD: text, hoTen: '', ngaySinh: '', diaChi: '', raw: text };
      }

      return { invalid: true, reason: `Quét được mã khác không phải CCCD: ${text.slice(0, 40)}` };
    }

    async function onFoundRaw(rawText) {
      const parsed = parseCCCD(rawText);
      if (!parsed) return;

      if (parsed.invalid) {
        setStatus('Lỗi: ' + parsed.reason, true);
        return;
      }

      isDone = true;
      stopScanLoop();
      stopCameraStream();
      setStatus('Đã nhận diện thành công mã QR CCCD!', false);
      resultEl.textContent = JSON.stringify(parsed, null, 2);
    }

    function stopScanLoop() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function stopCameraStream() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
    }

    // Cắt vùng trung tâm khung hình ra canvas rồi giải mã
    async function decodeCenterCrop() {
      if (!video.videoWidth || !video.videoHeight) return null;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropSize = Math.floor(Math.min(vw, vh) * 0.72);
      const sx = Math.floor((vw - cropSize) / 2);
      const sy = Math.floor((vh - cropSize) / 2);

      canvas.width = cropSize;
      canvas.height = cropSize;
      ctx.drawImage(video, sx, sy, cropSize, cropSize, 0, 0, cropSize, cropSize);

      if (nativeDetector) {
        try {
          const detected = await nativeDetector.detect(canvas);
          if (detected && detected.length > 0 && detected[0].rawValue) {
            return detected[0].rawValue;
          }
        } catch (_) {}
      }

      try {
        const res = await reader.decodeFromCanvas(canvas);
        if (res && res.getText()) {
          return res.getText();
        }
      } catch (_) {}

      return null;
    }

    async function runTick() {
      if (isBusy || isDone || video.readyState < 2) return;
      isBusy = true;
      tickCount += 1;
      metaEl.textContent = `BarcodeDetector: ${hasBarcodeDetector ? 'Có' : 'Không'} | Đã thử quét: ${tickCount} lượt`;

      try {
        const text = await decodeCenterCrop();
        if (text) {
          await onFoundRaw(text);
        }
      } finally {
        isBusy = false;
      }
    }

    async function startLive() {
      stopScanLoop();
      stopCameraStream();
      isDone = false;
      isBusy = false;
      tickCount = 0;
      resultEl.textContent = 'Chưa nhận diện được mã QR nào.';
      setStatus('Đang mở camera sau...', false);

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        video.srcObject = stream;
        await video.play();
        setStatus('Đang quét live... Đưa mã QR CCCD vào khung xanh.', false);
        timerId = setInterval(runTick, 250);
      } catch (err) {
        setStatus('Không mở được camera: ' + err.message, true);
      }
    }

    imgInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      stopScanLoop();
      stopCameraStream();
      setStatus('Đang đọc mã QR từ ảnh...', false);

      const url = URL.createObjectURL(file);
      try {
        const res = await reader.decodeFromImageUrl(url);
        await onFoundRaw(res.getText());
      } catch (err) {
        setStatus('Không đọc được mã QR từ ảnh này.', true);
      } finally {
        URL.revokeObjectURL(url);
        e.target.value = '';
      }
    });

    btnRestart.addEventListener('click', startLive);
    startLive();
  </script>
</body>
</html>
