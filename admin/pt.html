<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chụp Gần Mã QR CCCD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      max-width: 480px;
      margin: 20px auto;
      padding: 0 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .btn-main {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      background: #0f766e;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-sub {
      display: inline-block;
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tip {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      font-size: 13px;
      color: #92400e;
    }
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      background: #ecfdf5;
      color: #065f46;
    }
    .status.err {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px;">Quét Mã QR CCCD</h2>
    <p style="margin:0 0 12px; font-size:13px; color:#475569;">
      Bấm nút bên dưới và đưa camera lại gần <b>đúng ô mã QR</b> trên CCCD để chụp.
    </p>

    <label class="btn-main">
      Chụp ảnh mã QR CCCD
      <input type="file" id="camInput" accept="image/*" capture="environment" hidden />
    </label>

    <label class="btn-sub">
      Chọn ảnh có sẵn từ máy
      <input type="file" id="pickInput" accept="image/*" hidden />
    </label>

    <div class="tip">
      <b>Mẹo:</b> Hãy zoom hoặc đưa camera gần vào riêng ô mã QR (tránh để khuôn mặt trên thẻ lọt vào khung hình để camera không bị bắt nhầm khuôn mặt).
    </div>

    <div id="status" class="status">Sẵn sàng chụp/quét mã QR CCCD.</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px; font-size:15px;">Thông tin nhận diện</h3>
    <pre id="out">Chưa có dữ liệu.</pre>
  </div>

  <script type="module">
    import { BrowserQRCodeReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm';

    const camInput = document.getElementById('camInput');
    const pickInput = document.getElementById('pickInput');
    const statusEl = document.getElementById('status');
    const outEl = document.getElementById('out');
    const reader = new BrowserQRCodeReader();

    function setStatus(text, isErr = false) {
      statusEl.textContent = text;
      statusEl.className = isErr ? 'status err' : 'status';
    }

    function parseCCCD(raw) {
      const text = (raw || '').trim();
      if (!text) return null;

      if (/^https?:\/\//i.test(text) || /^000201/i.test(text) || /^WIFI:/i.test(text)) {
        return { error: 'Mã QR này không phải của CCCD.' };
      }

      if (text.includes('|')) {
        const parts = text.split('|').map(s => s.trim());
        const soCCCD = parts.find(p => /^\d{12}$/.test(p));
        const dobRaw = parts.find(p => /^(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])(19\d\d|20\d\d)$/.test(p));
        if (!soCCCD && !dobRaw) {
          return { error: 'Chuỗi QR không đúng định dạng CCCD.' };
        }
        const dobIdx = parts.indexOf(dobRaw);
        const ngaySinh = dobRaw ? `${dobRaw.slice(0,2)}/${dobRaw.slice(2,4)}/${dobRaw.slice(4)}` : '';
        const hoTen = (dobIdx > 0
          ? parts.slice(0, dobIdx).reverse().find(p => /[A-Za-zÀ-ỹ\s]{2,}/.test(p) && !/^\d+$/.test(p) && p !== soCCCD)
          : '') || parts[2] || '';
        const diaChi = dobIdx !== -1 ? (parts.slice(dobIdx + 2).find(p => p && !/^\d{8}$/.test(p)) || '') : '';
        return { soCCCD: soCCCD || '', hoTen, ngaySinh, diaChi, raw: text };
      }

      if (/^\d{12}$/.test(text)) {
        return { soCCCD: text, hoTen: '', ngaySinh: '', diaChi: '', raw: text };
      }

      return { error: `Mã QR không phải của CCCD: ${text.slice(0, 50)}` };
    }

    async function processFile(file) {
      if (!file) return;
      setStatus('Đang đọc mã QR từ ảnh...', false);
      const url = URL.createObjectURL(file);
      try {
        const res = await reader.decodeFromImageUrl(url);
        const parsed = parseCCCD(res.getText());
        if (!parsed) return;
        if (parsed.error) {
          setStatus('Lỗi: ' + parsed.error, true);
          return;
        }
        setStatus('Nhận diện CCCD thành công!', false);
        outEl.textContent = JSON.stringify(parsed, null, 2);
      } catch (err) {
        setStatus('Không đọc được mã QR. Hãy chụp gần hơn vào ô mã QR và tránh lóa đèn.', true);
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    camInput.addEventListener('change', async (e) => {
      await processFile(e.target.files[0]);
      e.target.value = '';
    });

    pickInput.addEventListener('change', async (e) => {
      await processFile(e.target.files[0]);
      e.target.value = '';
    });
  </script>
</body>
</html>
