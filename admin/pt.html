<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quét QR CCCD bằng ZXing</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      max-width: 520px;
      margin: 20px auto;
      padding: 0 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    video {
      width: 100%;
      max-height: 360px;
      background: #000;
      border-radius: 8px;
      object-fit: cover;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button, .btn-file {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: #0f766e;
      color: #fff;
      border-color: #0f766e;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #0f766e;
    }
    .field {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 14px;
    }
    .field:last-child { border-bottom: none; }
    .k { color: #64748b; font-weight: 600; }
    .v { font-weight: 600; text-align: right; word-break: break-word; }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 8px 0 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px;">Quét QR CCCD (ZXing)</h2>
    <p style="margin:0 0 10px; font-size:13px; color:#475569;">
      Đưa mã QR CCCD vào trước camera (cách khoảng 15–20 cm, tránh bóng đèn chiếu thẳng).
    </p>

    <video id="video" playsinline muted></video>

    <div class="row">
      <button type="button" class="primary" id="btnStart">Bật camera</button>
      <button type="button" id="btnStop">Tắt camera</button>
      <label class="btn-file">
        Quét từ ảnh
        <input type="file" id="fileInput" accept="image/*" hidden />
      </label>
    </div>

    <div id="status">Đang khởi tạo...</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px; font-size:16px;">Thông tin trích xuất</h3>
    <div class="field"><span class="k">Số CCCD:</span><span class="v" id="outCCCD">-</span></div>
    <div class="field"><span class="k">Số CMND cũ:</span><span class="v" id="outOld">-</span></div>
    <div class="field"><span class="k">Họ tên:</span><span class="v" id="outName">-</span></div>
    <div class="field"><span class="k">Ngày sinh:</span><span class="v" id="outDob">-</span></div>
    <div class="field"><span class="k">Giới tính:</span><span class="v" id="outGender">-</span></div>
    <div class="field"><span class="k">Địa chỉ:</span><span class="v" id="outAddr">-</span></div>
    <div class="field"><span class="k">Ngày cấp:</span><span class="v" id="outIssue">-</span></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 4px; font-size:16px;">Chuỗi thô QR</h3>
    <pre id="rawBox">Chưa có dữ liệu.</pre>
  </div>

  <script type="module">
    import { BrowserMultiFormatReader } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/+esm';

    const videoEl = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const rawBox = document.getElementById('rawBox');

    const codeReader = new BrowserMultiFormatReader();
    let controls = null;

    function fmtDate(d8) {
      return /^\d{8}$/.test(d8) ? `${d8.slice(0,2)}/${d8.slice(2,4)}/${d8.slice(4)}` : '';
    }

    function parseQR(text) {
      const parts = text.split('|').map(s => s.trim());
      const soCCCD = parts.find(p => /^\d{12}$/.test(p)) || parts[0] || '';
      const oldId = (parts[1] && /^\d{9,12}$/.test(parts[1]) && parts[1] !== soCCCD) ? parts[1] : '';
      const dobIdx = parts.findIndex(p => /^(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])(19\d\d|20\d\d)$/.test(p));
      const ngaySinh = dobIdx !== -1 ? fmtDate(parts[dobIdx]) : '';
      const hoTen = (dobIdx > 0
        ? parts.slice(0, dobIdx).reverse().find(p => /[A-Za-zÀ-ỹ\s]{2,}/.test(p) && !/^\d+$/.test(p) && p !== soCCCD && p !== oldId)
        : '') || parts[2] || '';
      const gioiTinh = dobIdx !== -1 ? (parts[dobIdx + 1] || '') : '';
      const diaChi = dobIdx !== -1
        ? (parts.slice(dobIdx + 2).find(p => p && !/^\d{8}$/.test(p)) || '')
        : '';
      const last = parts[parts.length - 1] || '';
      const ngayCap = (/^\d{8}$/.test(last) && fmtDate(last) !== ngaySinh) ? fmtDate(last) : '';

      return { soCCCD, oldId, hoTen, ngaySinh, gioiTinh, diaChi, ngayCap, parts };
    }

    function showResult(text) {
      const info = parseQR(text);
      document.getElementById('outCCCD').textContent = info.soCCCD || '(Không có)';
      document.getElementById('outOld').textContent = info.oldId || '(Không có)';
      document.getElementById('outName').textContent = info.hoTen || '(Không có)';
      document.getElementById('outDob').textContent = info.ngaySinh || '(Không có)';
      document.getElementById('outGender').textContent = info.gioiTinh || '(Không có)';
      document.getElementById('outAddr').textContent = info.diaChi || '(Không có)';
      document.getElementById('outIssue').textContent = info.ngayCap || '(Không có)';

      const detail = info.parts.map((v, i) => `[${i}]: "${v}"`).join('\n');
      rawBox.textContent = `${text}\n\n${detail}`;
      statusEl.textContent = 'Quét thành công!';
    }

    async function stopScan() {
      if (controls) {
        controls.stop();
        controls = null;
      }
    }

    async function startScan() {
      await stopScan();
      statusEl.textContent = 'Đang bật camera...';
      try {
        controls = await codeReader.decodeFromConstraints(
          {
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          },
          videoEl,
          (result, err) => {
            if (result) {
              const text = result.getText();
              showResult(text);
              stopScan();
            }
          }
        );
        statusEl.textContent = 'Camera đang quét... Đưa mã QR CCCD vào khung.';
      } catch (e) {
        statusEl.textContent = 'Lỗi mở camera: ' + e.message;
      }
    }

    document.getElementById('btnStart').addEventListener('click', startScan);
    document.getElementById('btnStop').addEventListener('click', async () => {
      await stopScan();
      statusEl.textContent = 'Đã tắt camera.';
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await stopScan();
      statusEl.textContent = 'Đang quét từ ảnh...';
      const url = URL.createObjectURL(file);
      try {
        const result = await codeReader.decodeFromImageUrl(url);
        showResult(result.getText());
      } catch (err) {
        statusEl.textContent = 'Không quét được từ ảnh này.';
      } finally {
        URL.revokeObjectURL(url);
        e.target.value = '';
      }
    });

    startScan();
  </script>
</body>
</html>
