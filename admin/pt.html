<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Quét QR CCCD (Tối ưu Camera)</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      max-width: 520px;
      margin: 20px auto;
      padding: 0 14px;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button, .file-btn {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary { background: #0f766e; color: #fff; border-color: #0f766e; }
    #status { margin-top: 10px; font-size: 13px; font-weight: 600; color: #0f766e; }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="margin:0 0 6px;">Quét QR CCCD (Tối ưu nét & độ phân giải)</h2>
    <p style="margin:0 0 10px; font-size:13px; color:#475569;">
      Giữ thẻ cách camera khoảng 15–25 cm, tránh ánh đèn chiếu thẳng gây lóa mặt thẻ.
    </p>

    <div id="reader"></div>

    <div class="controls">
      <button type="button" class="primary" id="btnStart">Bật lại camera</button>
      <button type="button" id="btnStop">Tắt camera</button>
      <label class="file-btn">
        Quét từ ảnh chụp
        <input type="file" id="fileInput" accept="image/*" hidden />
      </label>
    </div>

    <div id="status">Đang khởi tạo...</div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 6px; font-size:16px;">Kết quả</h3>
    <pre id="output">Chưa quét được mã nào.</pre>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    let isScanning = false;

    const html5QrCode = new Html5Qrcode('reader', {
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      verbose: false
    });

    function parseCCCDQR(decodedText) {
      const parts = decodedText.split('|').map(s => s.trim());
      const soCCCD = parts.find(p => /^\d{12}$/.test(p)) || parts[0] || '';
      const dobRaw = parts.find(p => /^(0[1-9]|[12][0-9]|3[01])(0[1-9]|1[0-2])(19\d\d|20\d\d)$/.test(p));
      const ngaySinh = dobRaw ? `${dobRaw.slice(0,2)}/${dobRaw.slice(2,4)}/${dobRaw.slice(4)}` : '';
      const hoTen = parts.find(p =>
        /[A-Za-zÀ-ỹ\s]{3,}/.test(p) && !/^\d+$/.test(p) && p !== soCCCD
      ) || '';
      const diaChi = parts.find(p => p.includes(',') && p.length > 10) || '';

      return { soCCCD, hoTen, ngaySinh, diaChi, parts };
    }

    async function startCamera() {
      if (isScanning) return;
      statusEl.textContent = 'Đang bật camera độ phân giải cao...';

      const cameraConfig = {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      };

      const scanConfig = {
        fps: 15,
        qrbox: (viewfinderWidth, viewfinderHeight) => {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const size = Math.floor(minEdge * 0.78);
          return { width: size, height: size };
        },
        aspectRatio: 1.333333
      };

      try {
        await html5QrCode.start(
          cameraConfig,
          scanConfig,
          async (decodedText) => {
            const parsed = parseCCCDQR(decodedText);
            outputEl.textContent = JSON.stringify(parsed, null, 2) + '\n\nRAW:\n' + decodedText;
            statusEl.textContent = 'Quét thành công!';
            await stopCamera();
          },
          () => {}
        );
        isScanning = true;
        statusEl.textContent = 'Camera đang mở. Đưa mã QR CCCD vào khung.';
      } catch (err) {
        // Fallback nếu thiết bị không hỗ trợ ràng buộc width/height 1280x720
        try {
          await html5QrCode.start(
            { facingMode: 'environment' },
            { fps: 12, qrbox: { width: 260, height: 260 } },
            async (decodedText) => {
              const parsed = parseCCCDQR(decodedText);
              outputEl.textContent = JSON.stringify(parsed, null, 2) + '\n\nRAW:\n' + decodedText;
              statusEl.textContent = 'Quét thành công!';
              await stopCamera();
            },
            () => {}
          );
          isScanning = true;
          statusEl.textContent = 'Camera đang mở (chế độ mặc định).';
        } catch (err2) {
          statusEl.textContent = 'Không mở được camera: ' + err2.message;
        }
      }
    }

    async function stopCamera() {
      if (!isScanning) return;
      try { await html5QrCode.stop(); } catch (e) {}
      isScanning = false;
    }

    document.getElementById('btnStart').addEventListener('click', startCamera);
    document.getElementById('btnStop').addEventListener('click', async () => {
      await stopCamera();
      statusEl.textContent = 'Đã tắt camera.';
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      await stopCamera();
      statusEl.textContent = 'Đang đọc QR từ ảnh...';
      try {
        const decodedText = await html5QrCode.scanFile(file, true);
        const parsed = parseCCCDQR(decodedText);
        outputEl.textContent = JSON.stringify(parsed, null, 2) + '\n\nRAW:\n' + decodedText;
        statusEl.textContent = 'Đọc từ ảnh thành công!';
      } catch (err) {
        statusEl.textContent = 'Không đọc được từ ảnh: ' + err.message;
      }
      e.target.value = '';
    });

    startCamera();
  </script>
</body>
</html>
