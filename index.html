<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chonanhnhanh.vn - Hệ Thống Chọn Ảnh Nhanh</title>
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://chonanhnhanh.vn/">
    <meta property="og:title" content="Chonanhnhanh.vn - Chọn Ảnh Nhanh">
    <meta property="og:description" content="Hệ thống quản lý khách hàng và chọn ảnh nhanh chóng qua link Google Drive.">
    <meta property="og:image" content="https://chonanhnhanh.vn/default-cover.jpg">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(reg => {
                    console.log("Root Service Worker active!");
                }).catch(err => {
                    console.error("SW registration failed", err);
                });
            });
        }
    </script>
</head>
<body>
    <p>Đang chuyển hướng hệ thống...</p>

    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Nếu là đường dẫn album công khai dạng: /studio/album (ví dụ: /phuoclam/kimngan)
        if (pathSegments.length === 2 && !window.location.pathname.startsWith('/admin')) {
            const studio = pathSegments[0];
            const album = pathSegments[1];

            // Kiểm tra xem có phải Bot mạng xã hội quét link không (Zalo, Facebook, v.v.)
            const ua = navigator.userAgent.toLowerCase();
            const isBot = /facebookexternalhit|zalo|bot|crawler|spider|robot|whatsapp|telegram|preview/i.test(ua);
            
            // Nếu là người dùng thật, chuyển hướng mượt mà vào trang client chọn ảnh
            if (!isBot) {
                window.location.replace(`https://chonanhnhanh.vn/admin/client?studio=${studio}&album=${album}`);
            }
        } else {
            // Nếu truy cập trang chủ, chuyển về trang quản trị
            if (window.location.pathname === '/' || window.location.pathname === '') {
                window.location.replace('admin/index');
            }
        }
    </script>
</body>
</html>
