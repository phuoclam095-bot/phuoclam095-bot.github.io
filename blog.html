<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Viết - CHONANHNHANH.VN</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00ebb0; --bg-deep: #050a14; --neon: 0 0 25px rgba(0, 235, 176, 0.6); }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--bg-deep); background-image: linear-gradient(to bottom, rgba(5, 10, 20, 1) 0%, rgba(5, 10, 20, 0.8) 40%, rgba(5, 10, 20, 0.95) 100%), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; min-height: 100vh; padding-top: 100px; }
        .navbar { background: rgba(5, 10, 20, 0.95); backdrop-filter: blur(30px); border-bottom: 1px solid rgba(255,255,255,0.08); min-height: 85px; position: fixed; width: 100%; top: 0; z-index: 2000; }
        .navbar-brand { font-weight: 900; color: var(--primary) !important; text-shadow: var(--neon); font-size: 1.25rem; text-decoration: none; }
        .post-container { max-width: 850px; margin: 40px auto; background: rgba(10, 17, 36, 0.95); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 28px; padding: 45px; box-shadow: 0 20px 50px rgba(0, 235, 176, 0.15); }
        .post-title { font-weight: 900; font-size: 2.3rem; color: #fff; margin-bottom: 20px; line-height: 1.3; }
        .post-meta { color: #94a3b8; font-size: 0.95rem; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 15px; }
        .post-img { width: 100%; max-height: 480px; object-fit: cover; border-radius: 20px; border: 2px solid rgba(0, 235, 176, 0.3); margin-bottom: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .post-content { color: #cbd5e1; line-height: 1.9; font-size: 1.05rem; white-space: pre-line; word-break: break-word; }
        .btn-back { background: rgba(0, 235, 176, 0.1); border: 1.5px solid var(--primary); color: var(--primary); font-weight: 900; padding: 10px 25px; border-radius: 50px; text-transform: uppercase; text-decoration: none; display: inline-block; transition: 0.3s; margin-bottom: 20px; }
        .btn-back:hover { background: var(--primary); color: #000; box-shadow: var(--neon); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container px-4">
            <a class="navbar-brand" href="blog.html"><i class="fas fa-arrow-left me-2"></i>CHONANHNHANH.VN - BLOG</a>
        </div>
    </nav>

    <div class="container px-3">
        <a href="blog.html" class="btn-back"><i class="fas fa-chevron-left me-2"></i> Quay lại trang chủ Blog</a>
        <div class="post-container" id="postDetailContainer">
            <div class="text-center py-5">
                <i class="fas fa-atom fa-spin fa-3x text-primary mb-3"></i>
                <p class="fw-bold">ĐANG TẢI NỘI DUNG CHI TIẾT...</p>
            </div>
        </div>
    </div>

    <script>
        const N8N_GET_BLOGS = 'https://wsm.congtubaclieu.com.vn/webhook/get-blogs';

        async function loadPostDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('id');
            const container = document.getElementById('postDetailContainer');

            if (!postId) {
                container.innerHTML = `<h3 class="text-danger text-center">Không tìm thấy mã bài viết hợp lệ!</h3>`;
                return;
            }

            try {
                const response = await fetch(N8N_GET_BLOGS);
                const data = await response.json();
                const realBlogs = Array.isArray(data) ? data : (data.data || []);
                
                // Khớp chính xác ID bài viết
                const post = realBlogs.find(b => String(b.id) === String(postId));

                if (post) {
                    const driveId = post.image?.includes('id=') ? post.image.split('id=')[1].split('&')[0] : post.image;
                    const imageUrl = post.id?.startsWith('DEMO') ? post.image : `https://drive.google.com/thumbnail?id=${driveId}&sz=w1200`;

                    container.innerHTML = `
                        <h1 class="post-title">${post.title}</h1>
                        <div class="post-meta">
                            <span><i class="fas fa-user-circle me-1 text-primary"></i> Tác giả: <b>${post.author || 'Ẩn danh'}</b></span> &bull; 
                            <span><i class="fas fa-calendar-alt me-1 text-primary"></i> Ngày đăng: ${post.date || 'Chưa rõ'}</span>
                        </div>
                        ${post.image ? `<img src="${imageUrl}" class="post-img" onerror="this.src='https://via.placeholder.com/800x450'">` : ''}
                        <div class="post-content">${post.content}</div>
                    `;
                } else {
                    container.innerHTML = `<h3 class="text-warning text-center">Bài viết này không tồn tại hoặc chưa được phê duyệt.</h3>`;
                }
            } catch (e) {
                console.error("Lỗi tải chi tiết bài viết:", e);
                container.innerHTML = `<h3 class="text-danger text-center">Không thể kết nối tới máy chủ để tải bài viết.</h3>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadPostDetail);
    </script>
</body>
</html>
