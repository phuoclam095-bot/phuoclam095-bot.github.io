<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <script>
        // Phân tách đường dẫn trên URL (Ví dụ: /phuoclam/tatnienctbl)
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Kiểm tra nếu là đường dẫn album công khai (không phải thư mục /admin)
        if (pathSegments.length >= 2 && !window.location.pathname.startsWith('/admin')) {
            const studioSlug = pathSegments[pathSegments.length - 2];
            const albumSlug = pathSegments[pathSegments.length - 1];
            
            // Chuyển hướng chính xác đến /admin/client.html kèm đúng tham số studio và album
            window.location.replace(`/admin/client.html?studio=${studioSlug}&album=${albumSlug}`);
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#00ebb0;">
        <h3>Đang tải không gian Studio...</h3>
    </div>
</body>
</html>
