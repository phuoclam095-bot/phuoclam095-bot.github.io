<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chonanhnhanh.vn - Đang điều hướng...</title>
    <script>
        // Lấy tất cả các phân đoạn trên đường dẫn URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Kiểm tra xem trong đường dẫn có chữ "admin" hay không
        const adminIndex = pathSegments.findIndex(segment => segment.toLowerCase() === 'admin');

        if (adminIndex !== -1) {
            // Nếu có chữ "admin", ta tiến hành lọc bỏ chữ "admin" ra khỏi danh sách phân đoạn
            // Đồng thời xử lý nếu đoạn tiếp theo là "client.html" hoặc "client" thì cũng lọc bỏ luôn
            let cleanSegments = pathSegments.filter(segment => {
                const lower = segment.toLowerCase();
                return lower !== 'admin' && lower !== 'client.html' && lower !== 'client';
            });

            // Nếu sau khi lọc mà vẫn còn đủ studio và album (ít nhất 2 phần)
            if (cleanSegments.length >= 2) {
                const studioSlug = cleanSegments[cleanSegments.length - 2];
                const albumSlug = cleanSegments[cleanSegments.length - 1];
                
                // Điều hướng về trang client sạch sẽ, bỏ hoàn toàn chữ admin và .html
                window.location.replace(`/client?studio=${studioSlug}&album=${albumSlug}`);
            } else {
                // Nếu chỉ có mỗi admin đơn thuần, giữ nguyên hoặc trỏ về trang chủ quản trị
                window.location.replace('/');
            }
        } 
        // Xử lý các đường dẫn dạng thông thường khác: /studio/album
        else if (pathSegments.length >= 2) {
            const studioSlug = pathSegments[pathSegments.length - 2];
            const albumSlug = pathSegments[pathSegments.length - 1];
            
            window.location.replace(`/client?studio=${studioSlug}&album=${albumSlug}`);
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body style="background-color: #050a14; color: #00ebb0; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h3>Đang tải không gian Chọn Ảnh Nhanh...</h3>
</body>
</html>
