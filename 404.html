<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <script>
        // Lấy các thành phần trên đường dẫn URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Nếu đường dẫn có dạng /ten-studio/ten-album-slug
        if (pathSegments.length >= 2) {
            let studioSlug = pathSegments[pathSegments.length - 2].replace(/[^0-9a-z]/g, '');
            let albumSlug = pathSegments[pathSegments.length - 1].replace(/[^0-9a-z]/g, '');
            
            // 🌟 Chuyển hướng về client.html nhưng truyền tham số là album=... thay vì id=...
            window.location.replace(`/client?album=${albumSlug}&studio=${studioSlug}`);
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#00ebb0;">
        <h3>Đang tải không gian Studio...</h3>
    </div>
</body>
</html>
