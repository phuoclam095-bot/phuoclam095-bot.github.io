<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <script>
        // Lấy các thành phần trên đường dẫn URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Nếu đường dẫn có dạng /ten-studio/ten-album-slug
        if (pathSegments.length >= 2) {
            const studioSlug = pathSegments[pathSegments.length - 2];
            const albumSlug = pathSegments[pathSegments.length - 1];
            
            // 🌟 ĐÃ SỬA LẠI ĐÚNG THỨ TỰ: studio đứng trước, album đứng sau
            window.location.replace(`/client.html?studio=${studioSlug}&album=${albumSlug}`);
        } else {
            window.location.replace('/');
        }
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#00ebb0;">
        <h3>Đang chuyển hướng đến album...</h3>
    </div>
</body>
</html>
