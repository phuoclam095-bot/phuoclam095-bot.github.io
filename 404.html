<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chonanhnhanh.vn - Đang chuyển hướng...</title>
    
    <script>
        // Chỉ file 404 mới thực hiện bắt pathSegments khi GitHub Pages báo không tìm thấy đường dẫn
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Nếu đường dẫn có đúng 2 phân đoạn chuẩn: /studio/album
        if (pathSegments.length === 2) {
            const studioSlug = pathSegments[0];
            const albumSlug = pathSegments[1];
        
            const ua = navigator.userAgent.toLowerCase();
            const isBot = /facebookexternalhit|zalo|bot|crawler|spider|robot|whatsapp|telegram|preview/i.test(ua);

            // Nếu là người dùng thật, chuyển hướng thẳng sang client kèm tham số chuẩn xác
            if (!isBot) {
                window.location.replace(`https://chonanhnhanh.vn/client?studio=${studioSlug}&album=${albumSlug}`);
            }
        } else {
            // Nếu không phải dạng đường dẫn album, đá về trang chủ gốc
            window.location.replace('https://chonanhnhanh.vn/');
        }
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#00ebb0;">
        <h3>Đang tải không gian Chọn Ảnh Nhanh...</h3>
    </div>
</body>
</html>
