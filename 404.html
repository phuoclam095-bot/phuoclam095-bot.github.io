<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chonanhnhanh.vn - Đang điều hướng...</title>
    <script>
        // Lấy tất cả các phân đoạn trên đường dẫn URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Kiểm tra xem đường dẫn có chứa chữ "admin" hay không
        const adminIndex = pathSegments.findIndex(segment => segment.toLowerCase() === 'admin');

        if (adminIndex !== -1) {
            // Nếu là đường dẫn admin, giữ nguyên không chuyển hướng
        } 
        // Nếu đường dẫn có dạng /studio/album (từ 2 phân đoạn trở lên)
        else if (pathSegments.length >= 2) {
            const studioSlug = pathSegments[pathSegments.length - 2];
            const albumSlug = pathSegments[pathSegments.length - 1];
            
            // 🌟 TRỎ ĐÚNG VỀ /client.html ĐỂ GITHUB PAGES KHÔNG BỊ LẶP LẠI LỖI 404
            window.location.replace(`/client.html?studio=${studioSlug}&album=${albumSlug}`);
        } else {
            // Các trường hợp khác về trang chủ
            window.location.replace('/');
        }
    </script>
</head>
<body style="background-color: #050a14; color: #00ebb0; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h3>Đang tải không gian Chọn Ảnh Nhanh...</h3>
</body>
</html>
