<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <script>
        async function redirectToClient() {
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            
            if (pathSegments.length >= 1) {
                const albumSlug = pathSegments[pathSegments.length - 1].replace(/[^0-9a-z]/g, '');
                
                try {
                    const res = await fetch(`https://wsm.congtubaclieu.com.vn/webhook/get-photos?album=${albumSlug}`);
                    const rawData = await res.json();
                    const data = Array.isArray(rawData) ? rawData[0] : rawData;
                    
                    const realStudioSlug = data && data.studio_slug ? data.studio_slug : 'studio';
                    
                    window.location.replace(`/admin/client?album=${albumSlug}&studio=${realStudioSlug}`);
                } catch (e) {
                    let fallbackStudio = pathSegments.length >= 2 ? pathSegments[pathSegments.length - 2].replace(/[^0-9a-z]/g, '') : 'studio';
                    window.location.replace(`/admin/client?album=${albumSlug}&studio=${fallbackStudio}`);
                }
            } else {
                window.location.replace('/');
            }
        }

        redirectToClient();
    </script>
</head>
<body>
    <div style="text-align:center; margin-top:20vh; font-family:sans-serif; color:#00ebb0;">
        <h3>Đang load album...</h3>
    </div>
</body>
</html>
