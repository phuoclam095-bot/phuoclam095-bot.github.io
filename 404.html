<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chonanhnhanh.vn - Đang điều hướng...</title>
    <script>
        // Lấy tất cả các phân đoạn trên đường dẫn URL
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // 🛑 1. TỐM NGAY LẬP TỨC NẾU CÓ CHỮ "admin"
        // Kiểm tra xem trong đường dẫn có bất kỳ phân đoạn nào là "admin" hay không
        const isAdminPath = pathSegments.some(segment => segment.toLowerCase() === 'admin');

        if (isAdminPath) {
            // Nếu là trang quản trị, giữ nguyên không chuyển hướng đi đâu cả
            // Cho phép các file trong thư mục/đường dẫn admin hoạt động bình thường
            // (Không làm gì cả, để trình duyệt tự render trang admin)
        } 
        // 🌟 2. XỬ LÝ ĐƯỜNG DẪN ALBUM KHÁCH HÀNG: /studio/album
        else if (pathSegments.length >= 2) {
            const studioSlug = pathSegments[pathSegments.length - 2];
            const albumSlug = pathSegments[pathSegments.length - 1];
            
            // Chuyển hướng sang client với đúng thứ tự tham số: studio trước, album sau
            window.location.replace(`/client.html?studio=${studioSlug}&album=${albumSlug}`);
        } 
        // 🏠 3. CÒN LẠI ĐÁ VỀ TRANG CHỦ
        else {
            window.location.replace('/');
        }
    </script>
</head>
<body style="background-color: #050a14; color: #00ebb0; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h3>Đang tải không gian Chọn Ảnh Nhanh...</h3>
</body>
</html>
