<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chonanhnhanh.vn - Đang điều hướng...</title>
    <script>
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        
        // Lọc bỏ các từ khóa rác, lấy đúng 2 phần tử cuối cùng làm studio và album
        const cleanSegments = pathSegments.filter(segment => {
            const lower = segment.toLowerCase();
            return lower !== 'admin' && lower !== 'client.html' && lower !== 'client';
        });

        if (cleanSegments.length >= 2) {
            const studioSlug = cleanSegments[cleanSegments.length - 2];
            const albumSlug = cleanSegments[cleanSegments.length - 1];
            
            // 🌟 Điều hướng thẳng về file client.html ở thư mục gốc kèm tham số chuẩn
            window.location.replace(`https://chonanhnhanh.vn/client.html?studio=${studioSlug}&album=${albumSlug}`);
        } else {
            window.location.replace('https://chonanhnhanh.vn/');
        }
    </script>
</head>
<body style="background-color: #050a14; color: #00ebb0; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h3>Đang tải không gian Chọn Ảnh Nhanh...</h3>
</body>
</html>
